name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: C++ and QEMU verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            llvm \
            lld \
            nasm \
            qemu-system-x86 \
            gdb \
            cmake \
            ninja-build \
            python3

      - name: Build and test
        run: python3 tools/os.py verify
