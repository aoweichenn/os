<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>x86-64 OS VGA</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
    }
    #status {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 20;
      padding: 4px 8px;
      border-radius: 0 0 0 6px;
      background: rgb(0 0 0 / 70%);
      color: #9f9;
      font: 12px/1.4 monospace;
    }
    #screen {
      width: 100vw;
      height: calc(100vh - 112px);
      height: calc(100dvh - 112px);
      min-width: 0;
      min-height: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }
    #screen canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      flex: 0 0 auto;
    }
    #screen.fit canvas {
      width: auto !important;
      height: auto !important;
      max-width: 100% !important;
      max-height: 100% !important;
    }
    #screen.native {
      display: block;
      overflow: auto;
    }
    #screen.native canvas {
      width: 720px !important;
      height: 400px !important;
      max-width: none !important;
      max-height: none !important;
    }
    #mobile_controls {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      padding: 8px;
      background: rgb(24 29 36 / 96%);
      box-shadow: 0 -2px 10px rgb(0 0 0 / 60%);
    }
    #command {
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 0 10px;
      border: 1px solid #7da2d6;
      border-radius: 6px;
      outline: none;
      background: #fff;
      color: #111;
      font: 16px/42px monospace;
    }
    #send {
      min-width: 64px;
      background: #2866b1;
      color: #fff;
    }
    #buttons {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }
    button {
      height: 38px;
      border: 0;
      border-radius: 6px;
      background: #526579;
      color: #fff;
      font-size: 14px;
      touch-action: manipulation;
    }
    button:active {
      background: #7992ad;
    }
    @media (orientation: landscape) {
      #screen {
        width: calc(100vw - min(38vw, 340px));
        height: 100vh;
        height: 100dvh;
      }
      #mobile_controls {
        top: 0;
        right: 0;
        bottom: 0;
        left: auto;
        width: min(38vw, 340px);
        align-content: center;
        box-shadow: -2px 0 10px rgb(0 0 0 / 60%);
      }
      #buttons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div id="status">连接中</div>
  <div id="screen" class="fit"></div>
  <form id="mobile_controls">
    <input id="command" type="text" inputmode="text" autocomplete="off" autocorrect="off"
      autocapitalize="none" spellcheck="false" placeholder="输入命令，例如 help">
    <button id="send" type="submit">发送</button>
    <div id="buttons">
      <button id="enter" type="button">回车</button>
      <button id="backspace" type="button">退格</button>
      <button id="interrupt" type="button">Ctrl-C</button>
      <button id="stop" type="button">Ctrl-Z</button>
      <button id="scale" type="button">原始清晰度</button>
    </div>
  </form>

  <script type="module">
    import RFB from './core/rfb.js';

    const OS_NOVNC_KEYSYM_BACKSPACE = 0xFF08;
    const OS_NOVNC_KEYSYM_RETURN = 0xFF0D;
    const OS_NOVNC_KEYSYM_CONTROL_LEFT = 0xFFE3;
    const OS_NOVNC_PRINTABLE_FIRST = 0x20;
    const OS_NOVNC_PRINTABLE_LAST = 0x7E;

    const status = document.getElementById('status');
    const screen = document.getElementById('screen');
    const command = document.getElementById('command');
    const scale = document.getElementById('scale');
    const webSocketScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const webSocketUrl = `${webSocketScheme}://${window.location.host}/websockify`;
    const rfb = new RFB(screen, webSocketUrl);
    let fitViewport = true;

    rfb.viewOnly = false;
    rfb.scaleViewport = false;
    rfb.addEventListener('connect', () => {
      status.textContent = '已连接';
      ApplyScaleMode();
      command.focus();
    });
    rfb.addEventListener('disconnect', event => {
      status.textContent = event.detail.clean ? '已断开' : '连接中断';
    });

    for (const eventName of ['keydown', 'keyup', 'keypress']) {
      command.addEventListener(eventName, event => event.stopPropagation());
    }

    function SendKeysym(keysym, code = null) {
      rfb.sendKey(keysym, code);
    }

    function SendControlCharacter(letter, code) {
      rfb.sendKey(OS_NOVNC_KEYSYM_CONTROL_LEFT, 'ControlLeft', true);
      rfb.sendKey(letter.charCodeAt(0), code, true);
      rfb.sendKey(letter.charCodeAt(0), code, false);
      rfb.sendKey(OS_NOVNC_KEYSYM_CONTROL_LEFT, 'ControlLeft', false);
    }

    function ApplyScaleMode() {
      screen.classList.toggle('fit', fitViewport);
      screen.classList.toggle('native', !fitViewport);
      scale.textContent = fitViewport ? '原始清晰度' : '适应屏幕';
    }

    function SendCommand() {
      for (const character of command.value) {
        const codePoint = character.codePointAt(0);
        if (codePoint >= OS_NOVNC_PRINTABLE_FIRST && codePoint <= OS_NOVNC_PRINTABLE_LAST) {
          SendKeysym(codePoint);
        }
      }
      SendKeysym(OS_NOVNC_KEYSYM_RETURN, 'Enter');
      command.value = '';
      command.focus();
    }

    document.getElementById('mobile_controls').addEventListener('submit', event => {
      event.preventDefault();
      SendCommand();
    });
    document.getElementById('enter').addEventListener('click', () => {
      SendKeysym(OS_NOVNC_KEYSYM_RETURN, 'Enter');
      command.focus();
    });
    document.getElementById('backspace').addEventListener('click', () => {
      SendKeysym(OS_NOVNC_KEYSYM_BACKSPACE, 'Backspace');
      command.focus();
    });
    document.getElementById('interrupt').addEventListener('click', () => {
      SendControlCharacter('c', 'KeyC');
      command.focus();
    });
    document.getElementById('stop').addEventListener('click', () => {
      SendControlCharacter('z', 'KeyZ');
      command.focus();
    });
    scale.addEventListener('click', () => {
      fitViewport = !fitViewport;
      ApplyScaleMode();
      command.focus();
    });
  </script>
</body>
</html>
