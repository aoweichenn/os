schema: x86-64-os-lab.hardware-register-map.v1
description: >-
  当前启动链直接使用的 CPU 架构状态、Local APIC、8259A、8254、i8042、
  16550A UART、ATA/IDE 主通道与 QEMU fw_cfg 寄存器。
  数值均为目标硬件协议值；软件模型不得把它们替换为宿主平台类型。
chips:
  cpu_x86_64:
    role: reset-and-mode-transition
    architectural_state:
      - name: RIP
        width_bits: 64
        kind: instruction-pointer
      - name: RFLAGS
        width_bits: 64
        kind: flags
        bits:
          0: CF
          2: PF
          4: AF
          6: ZF
          7: SF
          8: TF
          9: IF
          10: DF
          11: OF
      - name: CR0
        width_bits: 64
        kind: control-register
        bits:
          0: PE
          16: WP
          31: PG
      - name: CR3
        width_bits: 64
        kind: page-table-root
      - name: CR2
        width_bits: 64
        kind: page-fault-linear-address
      - name: CR4
        width_bits: 64
        kind: control-register
        bits:
          5: PAE
      - name: IA32_EFER
        width_bits: 64
        kind: msr
        address: 0xC0000080
        bits:
          8: LME
          10: LMA
          11: NXE
      - name: IA32_APIC_BASE
        width_bits: 64
        kind: msr
        address: 0x0000001B
        bits:
          8: BSP
          10: X2APIC_ENABLE
          11: APIC_GLOBAL_ENABLE
        current_policy: "keep bit 11 set, require bit 10 clear, and map the xAPIC MMIO base"
    local_apic:
      role: legacy-pic-virtual-wire-bridge
      base_source: "IA32_APIC_BASE bits 35..12 in the current xAPIC implementation"
      register_width_bits: 32
      page_mapping:
        writable: true
        executable: false
        user_accessible: false
        cache_disabled: true
      registers:
        - offset: 0x00F0
          name: SPURIOUS_INTERRUPT_VECTOR
          access: read-write
          bits:
            7..0: VECTOR
            8: SOFTWARE_ENABLE
          current_policy: "vector 0xFF and software enable set"
        - offset: 0x0350
          name: LVT_LINT0
          access: read-write
          bits:
            10..8: DELIVERY_MODE
            16: MASK
          current_policy: "delivery mode ExtINT (0b111), mask clear"
    page_translation:
      page_size_bytes: 4096
      table_entry_width_bits: 64
      entries_per_table: 512
      virtual_address_indices:
        pml4: 47..39
        pdpt: 38..30
        pd: 29..21
        pt: 20..12
        offset: 11..0
      leaf_entry_bits:
        0: PRESENT
        1: WRITABLE
        2: USER
        4: CACHE_DISABLE
        7: LARGE_PAGE
        63: NO_EXECUTE
      physical_address_bits: 51..12
      kernel_root_policy:
        null_page: not-present
        kernel_text: read-execute
        kernel_read_only_data: read-no-execute
        kernel_writable_data: read-write-no-execute
        heap: read-write-no-execute
        local_apic: read-write-no-execute-cache-disabled
        stack_guards: not-present
        user_text: user-read-execute
        user_data_and_stack: user-read-write-no-execute
    descriptor_state:
      gdtr:
        base_width_bits: 64
        limit_width_bits: 16
        load_instruction: LGDT
        store_instruction: SGDT
        current_limit: 55
      idtr:
        base_width_bits: 64
        limit_width_bits: 16
        load_instruction: LIDT
        store_instruction: SIDT
        current_limit: 4095
      selectors:
        kernel_code: 0x0008
        kernel_data: 0x0010
        user_data: 0x001B
        user_code: 0x0023
        task_state: 0x0028
      task_register:
        load_instruction: LTR
        store_instruction: STR
        current_selector: 0x0028
    global_descriptor_table:
      entry_size_bytes: 8
      entry_count: 7
      entries:
        - index: 0
          kind: null
        - index: 1
          kind: long-mode-ring0-code
          selector: 0x0008
        - index: 2
          kind: ring0-data
          selector: 0x0010
        - index: 3
          kind: ring3-data
          selector: 0x001B
        - index: 4
          kind: long-mode-ring3-code
          selector: 0x0023
        - index: 5
          kind: available-64-bit-tss-low
          selector: 0x0028
        - index: 6
          kind: available-64-bit-tss-high
    task_state_segment:
      size_bytes: 104
      io_permission_bitmap_offset: 104
      stacks:
        rsp0: privilege-transition-16-kib
        ist1: double-fault-16-kib
        ist2: non-maskable-interrupt-16-kib
        ist3: machine-check-16-kib
      guard_pages:
        - privilege-transition
        - double-fault
        - non-maskable-interrupt
        - machine-check
    interrupt_descriptor_table:
      gate_size_bytes: 16
      gate_count: 256
      present_vectors:
        exceptions: 0..31
        legacy_hardware_interrupts: 32..47
        system_call: 128
      gate_type: interrupt-gate
      kernel_code_selector: 0x0008
      ring3_callable_vectors:
        - 3
        - 4
        - 128
      interrupt_stack_table:
        2: 2
        8: 1
        18: 3
    privilege_transition:
      user_data_selector: 0x001B
      user_code_selector: 0x0023
      initial_rflags: 0x0000000000000202
      system_call_vector: 0x80
      user_stack_top: 0x00007FFFFFFF0000
      user_stack_page_count: 4
      user_stack_guard: 0x00007FFFFFFEA000
    exceptions:
      hardware_error_code_vectors:
        - 8
        - 10
        - 11
        - 12
        - 13
        - 14
        - 17
        - 21
        - 29
        - 30
      page_fault_error_code_bits:
        0: PRESENT
        1: WRITE
        2: USER
        3: RESERVED_WRITE
        4: INSTRUCTION_FETCH
        5: PROTECTION_KEY
        6: SHADOW_STACK
        15: SGX
  pic_8259a:
    role: legacy-interrupt-routing
    master:
      command_port: 0x0020
      data_port: 0x0021
      vector_base: 0x20
    slave:
      command_port: 0x00A0
      data_port: 0x00A1
      vector_base: 0x28
      cascade_identity: 2
    initialization:
      icw1: 0x11
      master_icw3: 0x04
      slave_icw3: 0x02
      icw4: 0x01
    operation:
      nonspecific_eoi: 0x20
      read_isr_ocw3: 0x0B
      initial_mask: 0xFFFF
      enabled_mask: 0xFFFC
      spurious_irqs:
        - 7
        - 15
    irq_vectors:
      irq0_timer: 0x20
      irq1_keyboard: 0x21
      irq2_cascade: 0x22
      irq7_spurious_test: 0x27
      irq15_spurious: 0x2F
  ns16550a_com1:
    role: serial-observability
    io_base: 0x03F8
    register_width_bits: 8
    registers:
      - offset: 0
        name: RBR_THR_DLL
        access: read-or-write
        selector: LCR.DLAB
        meaning: "DLAB=0: receive buffer/read; DLAB=0 write: transmit holding; DLAB=1: divisor low"
      - offset: 1
        name: IER_DLM
        access: read-or-write
        selector: LCR.DLAB
        meaning: "DLAB=0: interrupt enable; DLAB=1: divisor high"
      - offset: 2
        name: IIR_FCR
        access: read-or-write
        meaning: "read interrupt identification; write FIFO control"
      - offset: 3
        name: LCR
        access: read-write
        bits:
          0: WLS0
          1: WLS1
          2: STB
          3: PEN
          4: EPS
          5: STICK
          6: SET_BREAK
          7: DLAB
      - offset: 4
        name: MCR
        access: read-write
        bits:
          0: DTR
          1: RTS
          2: OUT1
          3: OUT2
          4: LOOP
      - offset: 5
        name: LSR
        access: read-only
        bits:
          0: DR
          1: OE
          2: PE
          3: FE
          4: BI
          5: THRE
          6: TEMT
          7: FIFO_ERROR
  pata_primary_master:
    role: stage1-disk-transport
    command_block_base: 0x01F0
    control_base: 0x03F6
    registers:
      - port: 0x01F0
        name: DATA
        width_bits: 16
        access: read-write
        meaning: 256 words per 512-byte sector
      - port: 0x01F1
        name: ERROR_FEATURES
        width_bits: 8
        access: read-or-write
        meaning: "read: error; write: features"
      - port: 0x01F2
        name: SECTOR_COUNT
        width_bits: 8
        access: read-write
      - port: 0x01F3
        name: LBA_LOW
        width_bits: 8
        access: read-write
      - port: 0x01F4
        name: LBA_MID
        width_bits: 8
        access: read-write
      - port: 0x01F5
        name: LBA_HIGH
        width_bits: 8
        access: read-write
      - port: 0x01F6
        name: DRIVE_HEAD
        width_bits: 8
        access: read-write
        bits:
          4: DEV
          5: DEV1
          6: LBA
          7: DEV0
        meaning: "LBA[27:24] occupies bits 0..3; current target is master with LBA mode"
      - port: 0x01F7
        name: STATUS_COMMAND
        width_bits: 8
        access: read-or-write
        meaning: "read: status; write: command; current command READ SECTORS=0x20"
        bits:
          0: ERR
          3: DRQ
          4: DSC
          5: DF
          6: DRDY
          7: BSY
      - port: 0x03F6
        name: ALTERNATE_STATUS_DEVICE_CONTROL
        width_bits: 8
        access: read-or-write
        meaning: "read: status without clearing pending interrupt; write: device control"
        bits:
          1: NIEN
          2: SOFTWARE_RESET
    error_register_bits:
      0: AMNF
      1: TK0NF
      2: ABRT
      3: MCR
      4: IDNF
      5: MC
      6: UNC
      7: BBK
  pit_8254:
    role: monotonic-clock-foundation
    ports:
      - name: COMMAND
        address: 0x43
        width_bits: 8
        access: write
        meaning: channel 0, lobyte/hibyte, mode 2
      - name: CHANNEL_0
        address: 0x40
        width_bits: 8
        access: read-write
        meaning: 16-bit divisor and latched counter
    divisor:
      input_frequency_hz: 1193182
      value: 0x04A9
      target_frequency_hz: 1000
      access_mode: low-byte-then-high-byte
      operating_mode: 2
      output_irq: 0
  i8042_ps2_controller:
    role: keyboard-input
    ports:
      - name: DATA
        address: 0x0060
        width_bits: 8
        access: read-write
        meaning: "read controller/device output; write first PS/2 device command"
      - name: STATUS_COMMAND
        address: 0x0064
        width_bits: 8
        access: read-or-write
        meaning: "read status; write controller command"
        status_bits:
          0: OUTPUT_BUFFER_FULL
          1: INPUT_BUFFER_FULL
          5: AUXILIARY_DEVICE_DATA
          6: TIMEOUT_ERROR
          7: PARITY_ERROR
    controller_commands:
      read_configuration: 0x20
      write_configuration: 0x60
      disable_first_port: 0xAD
      enable_first_port: 0xAE
      disable_second_port: 0xA7
    configuration_bits:
      0: FIRST_PORT_INTERRUPT
      1: SECOND_PORT_INTERRUPT
      4: FIRST_PORT_CLOCK_DISABLED
      5: SECOND_PORT_CLOCK_DISABLED
      6: FIRST_PORT_TRANSLATION
    keyboard_commands:
      enable_scanning: 0xF4
      acknowledge: 0xFA
    scan_code_set_1:
      extended_prefix: 0xE0
      release_bit: 0x80
      a_make: 0x1E
      a_break: 0x9E
  system_control_port_a:
    role: a20-gate-and-fast-reset
    ports:
      - name: CONTROL
        address: 0x92
        width_bits: 8
        access: read-write
        bits:
          0: FAST_RESET
          1: A20_GATE
  qemu_fw_cfg:
    role: physical-memory-discovery
    ports:
      - name: SELECTOR
        address: 0x0510
        width_bits: 16
        access: write
      - name: DATA
        address: 0x0511
        width_bits: 8
        access: read
    selectors:
      signature:
        key: 0x0000
        expected_ascii: QEMU
      file_directory:
        key: 0x0019
        count_width_bits: 32
        count_endianness: big
        entry_size_bytes: 64
        maximum_entry_count: 256
        entry:
          size_width_bits: 32
          selector_width_bits: 16
          name_size_bytes: 56
          integer_endianness: big
      physical_memory_map:
        file_name: etc/e820
        raw_entry_size_bytes: 20
        maximum_entry_count: 128
        payload_endianness: little
        fields:
          base_address_width_bits: 64
          length_width_bits: 64
          type_width_bits: 32
