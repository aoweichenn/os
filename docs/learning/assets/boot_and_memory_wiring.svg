<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000"
     viewBox="0 0 1800 1000" role="img"
     aria-labelledby="title description">
  <title id="title">复位、启动控制流与物理内存组装</title>
  <desc id="description">
    从 CPU reset vector 到 ROM、Stage 1、ELF loader、BootInfo 和 Kernel 的
    启动控制流，并列出关键物理内存区间与处理器模式变化。
  </desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12"
            refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12"
            refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
             fill: #172033; }
      .title { font-size: 35px; font-weight: 760; }
      .subtitle { font-size: 17px; fill: #526079; }
      .section { font-size: 22px; font-weight: 740; }
      .card-title { font-size: 21px; font-weight: 740; }
      .body { font-size: 16px; fill: #43516a; }
      .small { font-size: 14px; fill: #5d6b82; }
      .mono { font-family: "JetBrains Mono", "Noto Sans Mono", monospace; }
      .flow { fill: none; stroke: #334155; stroke-width: 3.5;
              marker-end: url(#arrow); }
      .memory { fill: none; stroke: #15803d; stroke-width: 3.5;
                marker-end: url(#arrow-green); }
      .card { fill: #ffffff; stroke: #8a98ad; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="#f4f7fb"/>
  <text x="60" y="60" class="title">图 3 · 复位、启动控制流与物理内存组装</text>
  <text x="60" y="91" class="subtitle">
    上：控制权依次交接　中：CPU 模式只向前推进　下：每块物理内存都有唯一所有者
  </text>

  <!-- Boot flow panel -->
  <rect x="55" y="125" width="1690" height="310" rx="22"
        fill="#ffffff" stroke="#aab7ca"/>
  <text x="80" y="160" class="section">A · 启动控制权</text>

  <rect x="80" y="195" width="280" height="190" rx="16"
        fill="#eef5ff" stroke="#5b8bd9" stroke-width="1.6"/>
  <text x="105" y="230" class="card-title">1 · CPU Reset</text>
  <text x="105" y="264" class="body mono">RIP → 0xFFFFFFF0</text>
  <text x="105" y="296" class="body">16-bit real mode</text>
  <text x="105" y="328" class="body">中断关闭，环境未建立</text>
  <text x="105" y="358" class="small">硬件规定第一条取指位置</text>

  <rect x="415" y="195" width="280" height="190" rx="16"
        fill="#fff6cf" stroke="#c58b13" stroke-width="1.6"/>
  <text x="440" y="230" class="card-title">2 · ROM Firmware</text>
  <text x="440" y="264" class="body">建立段、栈、COM1、PIT</text>
  <text x="440" y="296" class="body">ATA 读取并校验 Stage 1</text>
  <text x="440" y="328" class="body mono">load → PA 0x8000</text>
  <text x="440" y="358" class="small">交接：CS:IP → 0000:8000</text>

  <rect x="750" y="195" width="280" height="190" rx="16"
        fill="#fff0e5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="775" y="230" class="card-title">3 · Stage 1</text>
  <text x="775" y="264" class="body">A20 → GDT → Protected Mode</text>
  <text x="775" y="296" class="body">临时 PML4 / PDPT / PD</text>
  <text x="775" y="328" class="body">PAE、CR3、LME、PG</text>
  <text x="775" y="358" class="small">最终远跳进入 64-bit code segment</text>

  <rect x="1085" y="195" width="280" height="190" rx="16"
        fill="#edf8ff" stroke="#3f83b7" stroke-width="1.6"/>
  <text x="1110" y="230" class="card-title">4 · ELF / BootInfo</text>
  <text x="1110" y="264" class="body">fw_cfg 获取 E820</text>
  <text x="1110" y="296" class="body">ATA 读取并两遍验证 ELF64</text>
  <text x="1110" y="328" class="body">复制 PT_LOAD，清零 BSS</text>
  <text x="1110" y="358" class="small">交接：RDI = BootInfo</text>

  <rect x="1420" y="195" width="280" height="190" rx="16"
        fill="#e9f9ef" stroke="#16a34a" stroke-width="1.6"/>
  <text x="1445" y="230" class="card-title">5 · Kernel / Ring 0</text>
  <text x="1445" y="264" class="body">验证 BootInfo、BSS 与 CR3</text>
  <text x="1445" y="296" class="body">接管 GDT / TSS / IDT</text>
  <text x="1445" y="328" class="body">重建内存、设备与进程系统</text>
  <text x="1445" y="358" class="small">随后 IRETQ 进入 Ring 3</text>

  <path d="M 372 290 H 403" class="flow"/>
  <path d="M 707 290 H 738" class="flow"/>
  <path d="M 1042 290 H 1073" class="flow"/>
  <path d="M 1377 290 H 1408" class="flow"/>

  <!-- CPU mode panel -->
  <rect x="55" y="465" width="1690" height="125" rx="18"
        fill="#ffffff" stroke="#aab7ca"/>
  <text x="80" y="500" class="section">B · CPU 模式状态机</text>

  <rect x="285" y="520" width="285" height="45" rx="12" fill="#fff1df"/>
  <text x="365" y="549" class="body">Real Mode · 16 bit</text>
  <path d="M 582 543 H 638" class="flow"/>
  <rect x="650" y="520" width="285" height="45" rx="12" fill="#e9f2ff"/>
  <text x="706" y="549" class="body">Protected Mode · 32 bit</text>
  <path d="M 947 543 H 1003" class="flow"/>
  <rect x="1015" y="520" width="285" height="45" rx="12" fill="#e9f9ef"/>
  <text x="1093" y="549" class="body">Long Mode · 64 bit</text>
  <text x="1370" y="549" class="small">没有“跳过中间状态”的捷径</text>

  <!-- Memory ownership -->
  <rect x="55" y="620" width="1690" height="325" rx="22"
        fill="#ffffff" stroke="#aab7ca"/>
  <text x="80" y="657" class="section">C · 关键物理区间（示意，不按比例）</text>

  <rect x="80" y="690" width="310" height="150" rx="15"
        fill="#fff6cf" stroke="#c58b13"/>
  <text x="105" y="724" class="card-title">低端启动工作区</text>
  <text x="105" y="755" class="body mono">0x0500 / 0x8000</text>
  <text x="105" y="783" class="body mono">0x10000..0x18BFF</text>
  <text x="105" y="812" class="small">Stage 1、临时页表、BootInfo、E820</text>

  <rect x="420" y="690" width="310" height="150" rx="15"
        fill="#e9f9ef" stroke="#16a34a"/>
  <text x="445" y="724" class="card-title">Kernel PT_LOAD</text>
  <text x="445" y="755" class="body mono">[0x00100000, 0x03E00000)</text>
  <text x="445" y="783" class="body">代码、只读数据、数据、BSS</text>
  <text x="445" y="812" class="small">ELF 第一遍验证完毕后才允许写入</text>

  <rect x="760" y="690" width="310" height="150" rx="15"
        fill="#edf8ff" stroke="#3f83b7"/>
  <text x="785" y="724" class="card-title">Kernel ELF staging</text>
  <text x="785" y="755" class="body mono">[0x03E00000, 0x03F00000)</text>
  <text x="785" y="783" class="body">ATA 读取的精确 ELF 文件</text>
  <text x="785" y="812" class="small">与 PT_LOAD 目标区严格不重叠</text>

  <rect x="1100" y="690" width="270" height="150" rx="15"
        fill="#f3efff" stroke="#8b5cf6"/>
  <text x="1125" y="724" class="card-title">早期 Kernel 栈</text>
  <text x="1125" y="755" class="body mono">0x03FEF000..0x03FFEFFF</text>
  <text x="1125" y="783" class="body">v1.0 固定布局</text>
  <text x="1125" y="812" class="small">v1.1 起动态双 guard 栈；v1.5 保留</text>

  <rect x="1400" y="690" width="300" height="150" rx="15"
        fill="#fff6cf" stroke="#c58b13"/>
  <text x="1425" y="724" class="card-title">128 KiB ROM</text>
  <text x="1425" y="755" class="body mono">[0xFFFE0000, 4 GiB)</text>
  <text x="1425" y="783" class="body mono">reset = 0xFFFFFFF0</text>
  <text x="1425" y="812" class="small">只读取指；不属于可分配 RAM</text>

  <rect x="520" y="864" width="760" height="55" rx="13"
        fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="555" y="898" class="body mono">
    Kernel direct map：VA = 0xFFFF888000000000 + PA；只映射受认可的 RAM
  </text>
</svg>
