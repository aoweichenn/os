<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000"
     viewBox="0 0 1800 1000" role="img"
     aria-labelledby="title description">
  <title id="title">PIT 和键盘中断经过 PIC 与 Local APIC 到达 CPU</title>
  <desc id="description">
    上方硬件泳道展示 IRQ0 与 IRQ1 进入 8259A PIC，再经 Local APIC LINT0
    ExtINT 到达 CPU IDT。下方软件泳道展示汇编入口、C++ 分派、设备处理、
    EOI 和 IRETQ。
  </desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6"
                    flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-red" markerWidth="12" markerHeight="12"
            refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12"
            refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
             fill: #172033; }
      .title { font-size: 35px; font-weight: 760; }
      .subtitle { font-size: 17px; fill: #526079; }
      .lane-title { font-size: 21px; font-weight: 740; }
      .card-title { font-size: 21px; font-weight: 740; }
      .body { font-size: 16px; fill: #42516a; }
      .small { font-size: 14px; fill: #5d6b82; }
      .mono { font-family: "JetBrains Mono", "Noto Sans Mono", monospace; }
      .irq { fill: none; stroke: #dc2626; stroke-width: 4;
             marker-end: url(#arrow-red); }
      .flow { fill: none; stroke: #334155; stroke-width: 3.5;
              marker-end: url(#arrow-dark); }
      .pill { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="#f4f7fb"/>
  <text x="60" y="60" class="title">图 5 · 中断路由：设备 IRQ 到 Kernel，再安全返回</text>
  <text x="60" y="91" class="subtitle">
    红线只表示异步中断请求；PIC 端口配置、LAPIC MMIO 和 handler 内部数据访问不画在同一层
  </text>

  <!-- Hardware lane -->
  <rect x="55" y="130" width="1690" height="390" rx="22"
        fill="#fffafa" stroke="none" filter="url(#shadow)"/>
  <text x="85" y="168" class="lane-title">硬件泳道</text>

  <rect x="90" y="215" width="270" height="115" rx="15"
        fill="#fff1f1" stroke="#dc2626" stroke-width="1.5"/>
  <text x="115" y="250" class="card-title">8254 PIT</text>
  <text x="115" y="281" class="body">channel 0 · 约 1000 Hz</text>
  <text x="115" y="307" class="small">周期脉冲输出</text>

  <rect x="90" y="365" width="270" height="115" rx="15"
        fill="#fff1f1" stroke="#dc2626" stroke-width="1.5"/>
  <text x="115" y="400" class="card-title">i8042 / PS2</text>
  <text x="115" y="431" class="body">scan code 已进入 output buffer</text>
  <text x="115" y="457" class="small">通知 CPU 读取 data port 0x60</text>

  <rect x="470" y="270" width="300" height="165" rx="17"
        fill="#fee8e8" stroke="#dc2626" stroke-width="2"/>
  <text x="495" y="307" class="card-title">8259A PIC</text>
  <text x="495" y="339" class="body">IRQ0 / IRQ1 unmasked</text>
  <text x="495" y="369" class="body mono">vectors 0x20 / 0x21</text>
  <text x="495" y="399" class="small">IRR → ISR；等待 handler 发送 EOI</text>

  <rect x="880" y="270" width="300" height="165" rx="17"
        fill="#fee8e8" stroke="#dc2626" stroke-width="2"/>
  <text x="905" y="307" class="card-title">Local APIC</text>
  <text x="905" y="339" class="body mono">MMIO PA 0xFEE00000</text>
  <text x="905" y="369" class="body">LINT0 = ExtINT · unmasked</text>
  <text x="905" y="399" class="small">把 legacy PIC INTR 桥接给 BSP</text>

  <rect x="1290" y="270" width="420" height="165" rx="17"
        fill="#e7f0ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1315" y="307" class="card-title">CPU / IDT</text>
  <text x="1315" y="339" class="body">IF=1 时接受可屏蔽外部中断</text>
  <text x="1315" y="369" class="body">按 vector 查 16-byte interrupt gate</text>
  <text x="1315" y="399" class="small">必要时切换 RSP0 / IST，并由 CPU 压入现场</text>

  <!-- IRQ paths and labels -->
  <path d="M 372 272 H 410 V 315 H 458" class="irq"/>
  <rect x="375" y="232" width="76" height="28" rx="14" fill="#fee2e2"/>
  <text x="394" y="251" class="pill">IRQ0</text>

  <path d="M 372 422 H 430 V 390 H 458" class="irq"/>
  <rect x="375" y="438" width="76" height="28" rx="14" fill="#fee2e2"/>
  <text x="394" y="457" class="pill">IRQ1</text>

  <path d="M 782 352 H 868" class="irq"/>
  <rect x="788" y="308" width="74" height="28" rx="14" fill="#fee2e2"/>
  <text x="807" y="327" class="pill">INTR</text>

  <path d="M 1192 352 H 1278" class="irq"/>
  <rect x="1190" y="308" width="90" height="28" rx="14" fill="#fee2e2"/>
  <text x="1207" y="327" class="pill">ExtINT</text>

  <!-- Software lane -->
  <rect x="55" y="555" width="1690" height="370" rx="22"
        fill="#ffffff" stroke="none" filter="url(#shadow)"/>
  <text x="85" y="593" class="lane-title">Kernel 软件泳道</text>

  <rect x="120" y="650" width="310" height="145" rx="16"
        fill="#eef4ff" stroke="#5b8bd9" stroke-width="1.6"/>
  <text x="145" y="686" class="card-title">1 · 汇编入口</text>
  <text x="145" y="718" class="body">补齐统一 exception / IRQ frame</text>
  <text x="145" y="748" class="body">保存寄存器，执行 CLD</text>
  <text x="145" y="776" class="small">C++ 看到固定布局，而非多种 CPU 栈形态</text>

  <rect x="505" y="650" width="310" height="145" rx="16"
        fill="#eef4ff" stroke="#5b8bd9" stroke-width="1.6"/>
  <text x="530" y="686" class="card-title">2 · C++ dispatcher</text>
  <text x="530" y="718" class="body">检查 vector 与 frame 来源</text>
  <text x="530" y="748" class="body">区分 exception、IRQ、syscall</text>
  <text x="530" y="776" class="small">非法状态进入确定性失败路径</text>

  <rect x="890" y="650" width="310" height="145" rx="16"
        fill="#eefaf2" stroke="#31a75b" stroke-width="1.6"/>
  <text x="915" y="686" class="card-title">3 · 设备处理</text>
  <text x="915" y="718" class="body">IRQ0：tick / scheduler</text>
  <text x="915" y="748" class="body">IRQ1：读取并解码 scan code</text>
  <text x="915" y="776" class="small">handler 只做有界工作，阻塞逻辑留在进程侧</text>

  <rect x="1275" y="650" width="350" height="145" rx="16"
        fill="#fff1f1" stroke="#dc2626" stroke-width="1.6"/>
  <text x="1300" y="686" class="card-title">4 · 完成与返回</text>
  <text x="1300" y="718" class="body">向 PIC 发送 non-specific EOI</text>
  <text x="1300" y="748" class="body">恢复寄存器并执行 IRETQ</text>
  <text x="1300" y="776" class="small">IRQ0 可选择切到另一个进程的返回现场</text>

  <!-- CPU-to-software handoff routed in the lane gap -->
  <path d="M 1500 447 V 535 H 275 V 638" class="flow"/>
  <path d="M 442 722 H 493" class="flow"/>
  <path d="M 827 722 H 878" class="flow"/>
  <path d="M 1212 722 H 1263" class="flow"/>

  <rect x="555" y="845" width="690" height="45" rx="12"
        fill="#fff1f1" stroke="none"/>
  <text x="590" y="874" class="small">
    完成阶段先向 PIC 发送 EOI，再由 IRETQ 返回；反馈语义用文字表示，不画跨图回路线
  </text>

  <rect x="55" y="947" width="1690" height="38" rx="11"
        fill="#ffffff" stroke="#c7d1df"/>
  <text x="80" y="972" class="small">
    初始化期间 CLI；GDT/TSS/IDT、PIC、LAPIC 和设备全部就绪后才 STI。ATA IRQ14 保持关闭。
  </text>
</svg>
