      .schematic-wire[data-kind="power"] {
          stroke: #dc2626; stroke-width: 3.2;
      }
      .schematic-wire[data-kind="ground"] {
          stroke: #334155; stroke-width: 2.8;
      }
      .schematic-wire[data-kind="control"] {
          stroke: #7c3aed; stroke-width: 2.1;
