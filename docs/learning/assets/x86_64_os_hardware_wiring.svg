<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"
     viewBox="0 0 1600 900" role="img"
     aria-labelledby="title description">
  <title id="title">x86-64 OS Lab 整机硬件连线总览</title>
  <desc id="description">
    低密度总览图，展示宿主边界、ROM、CPU、RAM、Local APIC、端口 I/O 总线、
    串口、定时器、键盘、ATA 磁盘和 PIC 的主要连接。
  </desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7"
                    flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-green" markerWidth="12" markerHeight="12"
            refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12"
            refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12"
            refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12"
            refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
             fill: #172033; }
      .title { font-size: 34px; font-weight: 760; }
      .subtitle { font-size: 17px; fill: #526079; }
      .section { font-size: 21px; font-weight: 720; }
      .card-title { font-size: 21px; font-weight: 740; }
      .body { font-size: 16px; fill: #42516a; }
      .small { font-size: 14px; fill: #5b6880; }
      .mono { font-family: "JetBrains Mono", "Noto Sans Mono", monospace; }
      .panel { fill: #ffffff; stroke: #aab7cb; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #71819b; stroke-width: 1.5; }
      .memory { fill: none; stroke: #15803d; stroke-width: 4;
                marker-end: url(#arrow-green); }
      .memory-bi { fill: none; stroke: #15803d; stroke-width: 4; }
      .io { fill: none; stroke: #2563eb; stroke-width: 4;
            stroke-dasharray: 10 8; marker-end: url(#arrow-blue); }
      .io-bi { fill: none; stroke: #2563eb; stroke-width: 4;
               stroke-dasharray: 10 8; }
      .irq { fill: none; stroke: #dc2626; stroke-width: 4;
             marker-end: url(#arrow-red); }
      .host { fill: none; stroke: #7c3aed; stroke-width: 3;
              stroke-dasharray: 8 7; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f4f7fb"/>
  <text x="55" y="58" class="title">x86-64 OS Lab：整机硬件连线总览</text>
  <text x="55" y="88" class="subtitle">
    这里只保留一级关系；启动、端口、中断、键盘和磁盘细节分别展开在后续专题图
  </text>

  <!-- Host boundary -->
  <rect x="55" y="120" width="1490" height="115" rx="18"
        fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="80" y="153" class="section">宿主机边界（不进入 Guest 镜像）</text>
  <rect x="80" y="169" width="390" height="45" rx="10" fill="#ede9fe"/>
  <text x="100" y="197" class="body">Clang / LLD / NASM → ROM 与 raw disk</text>
  <rect x="605" y="169" width="390" height="45" rx="10" fill="#ede9fe"/>
  <text x="625" y="197" class="body">QEMU TCG：只模拟 CPU、总线和设备</text>
  <rect x="1130" y="169" width="390" height="45" rx="10" fill="#ede9fe"/>
  <text x="1150" y="197" class="body">Serial / GDB / QMP：观察与输入</text>

  <!-- Guest boundary -->
  <rect x="55" y="260" width="1490" height="555" rx="22"
        class="panel" filter="url(#shadow)"/>
  <text x="80" y="296" class="section">QEMU PC Guest 硬件边界</text>

  <!-- ROM -->
  <rect x="100" y="335" width="330" height="145" rx="16"
        fill="#fff7cc" stroke="#b98713" stroke-width="1.8"/>
  <text x="125" y="370" class="card-title">128 KiB ROM</text>
  <text x="125" y="400" class="body mono">PA 0xFFFE0000..0xFFFFFFFF</text>
  <text x="125" y="430" class="body mono">reset 0xFFFFFFF0</text>
  <text x="125" y="458" class="small">Firmware 拥有第一条指令</text>

  <!-- RAM -->
  <rect x="100" y="565" width="330" height="175" rx="16"
        fill="#e7f9ed" stroke="#15803d" stroke-width="1.8"/>
  <text x="125" y="600" class="card-title">RAM / 物理地址空间</text>
  <text x="125" y="630" class="body">Stage 1、页表、BootInfo、Kernel</text>
  <text x="125" y="660" class="body">E820 决定 usable / reserved / holes</text>
  <text x="125" y="690" class="body">正式页表建立高半区 direct map</text>
  <text x="125" y="718" class="small">详细布局见“启动与内存”图</text>

  <!-- CPU -->
  <rect x="610" y="325" width="380" height="185" rx="20"
        fill="#dcecff" stroke="#2563eb" stroke-width="2.4"
        filter="url(#shadow)"/>
  <text x="640" y="364" class="card-title">x86-64 CPU / BSP</text>
  <text x="640" y="397" class="body">Reset → Real 16 → Protected 32 → Long 64</text>
  <text x="640" y="428" class="body">MMU / CR3：PML4 → PDPT → PD → PT</text>
  <text x="640" y="459" class="body">GDT / TSS / IDT：Ring 0 ↔ Ring 3</text>
  <text x="640" y="488" class="small">取指、IN/OUT、中断压栈、页表遍历</text>

  <!-- LAPIC -->
  <rect x="1270" y="335" width="230" height="145" rx="16"
        fill="#fee8e8" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1295" y="370" class="card-title">Local APIC</text>
  <text x="1295" y="400" class="body mono">MMIO 0xFEE00000</text>
  <text x="1295" y="430" class="body">LINT0 = ExtINT</text>
  <text x="1295" y="458" class="small">legacy PIC → CPU 桥接</text>

  <!-- Port bus -->
  <rect x="515" y="570" width="650" height="66" rx="14"
        fill="#e4efff" stroke="#2563eb" stroke-width="2"/>
  <text x="545" y="610" class="card-title">x86 Port I/O 总线 · 16-bit port space</text>

  <!-- Device groups -->
  <rect x="500" y="680" width="215" height="80" rx="13"
        fill="#eef8ff" stroke="#4f7ca8" stroke-width="1.5"/>
  <text x="520" y="711" class="card-title">观察 / 平台</text>
  <text x="520" y="741" class="body">COM1 · fw_cfg</text>

  <rect x="750" y="680" width="215" height="80" rx="13"
        fill="#fff0f0" stroke="#dc2626" stroke-width="1.5"/>
  <text x="770" y="711" class="card-title">时间 / 输入</text>
  <text x="770" y="741" class="body">PIT · i8042 / PS2</text>

  <rect x="1000" y="680" width="215" height="80" rx="13"
        fill="#fff6d8" stroke="#c88712" stroke-width="1.5"/>
  <text x="1020" y="711" class="card-title">持久存储</text>
  <text x="1020" y="741" class="body">ATA PIO · raw disk</text>

  <!-- PIC -->
  <rect x="1270" y="565" width="230" height="175" rx="16"
        fill="#fee8e8" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1295" y="600" class="card-title">8259A PIC</text>
  <text x="1295" y="630" class="body mono">0x20/21 · 0xA0/A1</text>
  <text x="1295" y="660" class="body">IRQ0..15 → 0x20..0x2F</text>
  <text x="1295" y="690" class="body">当前 unmask IRQ0 / IRQ1</text>
  <text x="1295" y="718" class="small">EOI 后才允许下一请求推进</text>

  <!-- Connections: all routed through whitespace -->
  <path d="M 442 407 H 598" class="memory"/>
  <path d="M 442 650 H 500 V 470 H 598" class="memory-bi"/>
  <path d="M 1002 375 H 1258" class="memory"/>
  <path d="M 950 522 V 540 H 1130 V 558" class="io-bi"/>
  <path d="M 607 648 V 668" class="io-bi"/>
  <path d="M 857 648 V 668" class="io-bi"/>
  <path d="M 1107 648 V 668" class="io-bi"/>
  <path d="M 977 700 V 655 H 1258" class="irq"/>
  <path d="M 1385 553 V 492" class="irq"/>
  <path d="M 1258 430 H 1002" class="irq"/>

  <!-- QEMU instantiates the Guest; detailed host paths live in topic diagrams. -->
  <path d="M 800 226 V 248" class="host"/>

  <!-- Legend -->
  <rect x="55" y="838" width="1490" height="42" rx="12"
        fill="#ffffff" stroke="#c7d1df"/>
  <line x1="90" y1="859" x2="145" y2="859"
        stroke="#15803d" stroke-width="4"/>
  <text x="158" y="865" class="small">内存 / MMIO</text>
  <line x1="340" y1="859" x2="395" y2="859"
        stroke="#2563eb" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="408" y="865" class="small">Port I/O</text>
  <line x1="575" y1="859" x2="630" y2="859"
        stroke="#dc2626" stroke-width="4"/>
  <text x="643" y="865" class="small">IRQ</text>
  <line x1="750" y1="859" x2="805" y2="859"
        stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="818" y="865" class="small">宿主控制 / 观测</text>
  <text x="1160" y="865" class="small">专题图 2—7 展开每一条路径</text>
</svg>
